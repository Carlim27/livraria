<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Livraria Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#faf7f2;--surf:#fff;--ink:#1f1a17;--mut:#6f655d;--line:#e8e0d6;--acc:#9a3b1f;--acc2:#7a2d16;--onacc:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16120f;--surf:#211b17;--ink:#f3ece4;--mut:#a69a8f;--line:#352d27;--acc:#e07a4f;--acc2:#f0946d;--onacc:#1a0f09}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16120f;--surf:#211b17;--ink:#f3ece4;--mut:#a69a8f;--line:#352d27;--acc:#e07a4f;--acc2:#f0946d;--onacc:#1a0f09}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.2;margin:0}
a{color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar{max-width:1080px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font:700 1.3rem Fraunces,Georgia,serif;color:var(--acc);text-decoration:none;margin-right:auto}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:500;color:var(--mut);white-space:nowrap}
nav a.on{background:var(--acc);color:var(--onacc)}
nav a.adm{border:1px dashed var(--acc);color:var(--acc)}
nav a.adm.on{color:var(--onacc)}
main{max-width:1080px;margin:auto;padding:32px 20px 64px}
.hero{padding:48px 0 40px;max-width:640px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem)}
.hero p{color:var(--mut);font-size:1.1rem;margin:16px 0 24px}
.btn{display:inline-block;background:var(--acc);color:var(--onacc);border:0;padding:11px 20px;border-radius:10px;font:600 .95rem Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--acc2)}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:7px 12px;font-size:.85rem}
.btn.danger{background:none;color:#c0392b;border:1px solid #c0392b}
h2{font-size:1.6rem;margin:8px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.cover{aspect-ratio:2/3;width:100%;object-fit:cover;display:block}
.ph{aspect-ratio:2/3;display:flex;align-items:flex-end;padding:16px;font:700 1.2rem Fraunces,serif;color:#fff;background:linear-gradient(160deg,#9a3b1f,#3d1a0e)}
.cb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);font-weight:600}
.cb h3{font-size:1.05rem}
.au{color:var(--mut);font-size:.88rem}
.ds{color:var(--mut);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pr{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px}
.pr b{font-size:1.15rem}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.tools input{flex:1;min-width:180px;width:auto}.tools select{width:auto}
label{display:block;font-size:.85rem;font-weight:600;margin:0 0 4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:32px}
.form .full{grid-column:1/-1}
@media(max-width:620px){.form{grid-template-columns:1fr}}
.row{display:flex;gap:14px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.row img,.row .th{width:44px;height:66px;border-radius:6px;object-fit:cover;background:linear-gradient(160deg,#9a3b1f,#3d1a0e);flex:none}
.row div{flex:1;min-width:0}.row small{color:var(--mut)}
.note{background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:12px 16px;margin-bottom:22px;color:var(--mut);font-size:.9rem}
.empty{color:var(--mut);padding:40px 0;text-align:center}
.prose{max-width:640px;color:var(--mut);white-space:pre-line}
footer{border-top:1px solid var(--line);padding:24px 20px;text-align:center;color:var(--mut);font-size:.85rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.9rem;z-index:20}
#toast:empty{display:none}
</style>
</head>
<body>
<header><div class="bar" id="bar"></div></header>
<main id="app"></main>
<footer id="foot"></footer>
<div id="toast"></div>
<script id="data" type="application/json">{"store":{"name":"Livraria Digital","tagline":"E-books para aprender, crescer e se inspirar.","about":"Somos uma livraria 100% digital. Cada e-book é escolhido com cuidado e chega ao seu e-mail logo após a compra.","contact":"contato@exemplo.com"},"books":[{"id":"ex1","title":"Finanças sem Complicação","author":"Autor Exemplo","cat":"Finanças","price":29.9,"desc":"Um guia direto para organizar o orçamento, sair das dívidas e começar a investir. (Livro de exemplo: remova no painel ADM.)","link":"","cover":""},{"id":"ex2","title":"Foco Profundo","author":"Autora Exemplo","cat":"Produtividade","price":19.9,"desc":"Métodos práticos para trabalhar com atenção total e entregar mais em menos tempo. (Livro de exemplo.)","link":"","cover":""},{"id":"ex3","title":"Receitas do Dia a Dia","author":"Autor Exemplo","cat":"Culinária","price":24.9,"desc":"Cinquenta receitas rápidas, saborosas e econômicas para a semana toda. (Livro de exemplo.)","link":"","cover":""}]}</script>
<script>
const S=JSON.parse(document.getElementById('data').textContent);
let isAdmin=false,filt={q:"",c:""},cover="";
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>Number(n).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const safe=u=>/^https?:\/\//i.test(u||"")?u:"";
const toast=m=>{const t=$("#toast");t.textContent=m;clearTimeout(toast.t);toast.t=setTimeout(()=>t.textContent="",3500)};
const tabs=[["inicio","Início"],["catalogo","Catálogo"],["sobre","Sobre"],["contato","Contato"]];
const route=()=>{let r=(location.hash||"#inicio").slice(1);if(r==="admin"&&!isAdmin)r="inicio";return tabs.some(t=>t[0]===r)||r==="admin"?r:"inicio"};

function cardHtml(b){
  const img=b.cover?`<img class="cover" src="${esc(b.cover)}" alt="Capa de ${esc(b.title)}">`:`<div class="ph">${esc(b.title)}</div>`;
  const l=safe(b.link);
  return `<article class="card">${img}<div class="cb"><span class="cat">${esc(b.cat||"E-book")}</span><h3>${esc(b.title)}</h3><span class="au">${esc(b.author)}</span><p class="ds">${esc(b.desc)}</p><div class="pr"><b>${brl(b.price)}</b>${l?`<a class="btn sm" href="${esc(l)}" target="_blank" rel="noopener">Comprar</a>`:`<span class="au">Em breve</span>`}</div></div></article>`;
}
function contactHref(c){c=(c||"").trim();if(safe(c))return c;if(c.includes("@"))return"mailto:"+c;const d=c.replace(/\D/g,"");return d.length>=10?"https://wa.me/"+d:""}

function render(){
  const r=route(),st=S.store;
  document.title=st.name;
  $("#bar").innerHTML=`<a class="logo" href="#inicio">${esc(st.name)}</a><nav>${tabs.map(t=>`<a href="#${t[0]}" class="${r===t[0]?"on":""}">${t[1]}</a>`).join("")}${isAdmin?`<a href="#admin" class="adm ${r==="admin"?"on":""}">⚙ Painel ADM</a>`:""}</nav>`;
  $("#foot").textContent="© "+new Date().getFullYear()+" "+st.name+". Todos os direitos reservados.";
  const A=$("#app");
  if(r==="inicio"){
    const n=S.books.slice(-4).reverse();
    A.innerHTML=`<section class="hero"><h1>${esc(st.name)}</h1><p>${esc(st.tagline)}</p><a class="btn" href="#catalogo">Ver catálogo</a></section><h2>Novidades</h2>${n.length?`<div class="grid">${n.map(cardHtml).join("")}</div>`:`<p class="empty">Em breve, novos e-books por aqui.</p>`}`;
  }else if(r==="catalogo"){
    const cats=[...new Set(S.books.map(b=>b.cat).filter(Boolean))].sort();
    A.innerHTML=`<h2>Catálogo</h2><div class="tools"><input id="q" placeholder="Buscar por título ou autor…" value="${esc(filt.q)}"><select id="c"><option value="">Todas as categorias</option>${cats.map(c=>`<option ${c===filt.c?"selected":""}>${esc(c)}</option>`).join("")}</select></div><div id="list"></div>`;
    const draw=()=>{const q=filt.q.toLowerCase();const L=S.books.filter(b=>(!filt.c||b.cat===filt.c)&&(b.title+" "+b.author).toLowerCase().includes(q));$("#list").innerHTML=L.length?`<div class="grid">${L.map(cardHtml).join("")}</div>`:`<p class="empty">Nenhum e-book encontrado.</p>`};
    draw();$("#q").oninput=e=>{filt.q=e.target.value;draw()};$("#c").onchange=e=>{filt.c=e.target.value;draw()};
  }else if(r==="sobre"){
    A.innerHTML=`<h2>Sobre nós</h2><p class="prose">${esc(st.about)}</p>`;
  }else if(r==="contato"){
    const h=contactHref(st.contact);
    A.innerHTML=`<h2>Contato</h2><p class="prose">Dúvidas sobre algum e-book? Fale com a gente.</p><p style="margin-top:16px">${h?`<a class="btn" href="${esc(h)}" target="_blank" rel="noopener">Entrar em contato</a>`:esc(st.contact)}</p>`;
  }else adminView(A);
}

function adminView(A){
  A.innerHTML=`<h2>Painel ADM</h2><p class="note">Somente você vê esta aba. Visitantes só enxergam a vitrine e não conseguem alterar nada: qualquer mudança precisa ser publicada pela sua conta.</p>
  <h3 style="margin-bottom:12px">Adicionar e-book</h3>
  <div class="form"><div><label>Título *</label><input id="t"></div><div><label>Autor</label><input id="a"></div>
  <div><label>Categoria</label><input id="k" placeholder="Ex.: Finanças"></div><div><label>Preço (R$) *</label><input id="p" inputmode="decimal" placeholder="29,90"></div>
  <div class="full"><label>Link de compra (Hotmart, Kiwify, Mercado Pago, WhatsApp…)</label><input id="l" placeholder="https://…"></div>
  <div class="full"><label>Descrição</label><textarea id="d" rows="3"></textarea></div>
  <div class="full"><label>Capa (imagem)</label><input id="f" type="file" accept="image/*"></div>
  <div class="full"><button class="btn" id="add">Adicionar e publicar</button></div></div>
  <h3 style="margin-bottom:12px">E-books publicados (${S.books.length})</h3><div id="rows"></div>
  <h3 style="margin:32px 0 12px">Dados da loja</h3>
  <div class="form"><div><label>Nome da loja</label><input id="sn" value="${esc(S.store.name)}"></div><div><label>Contato (e-mail, WhatsApp ou link)</label><input id="sc" value="${esc(S.store.contact)}"></div>
  <div class="full"><label>Frase de destaque</label><input id="sg" value="${esc(S.store.tagline)}"></div><div class="full"><label>Sobre</label><textarea id="sa" rows="3">${esc(S.store.about)}</textarea></div>
  <div class="full"><button class="btn ghost" id="ss">Salvar dados da loja</button></div></div>`;
  $("#rows").innerHTML=S.books.length?S.books.map(b=>`<div class="row">${b.cover?`<img src="${esc(b.cover)}" alt="">`:`<span class="th"></span>`}<div><b>${esc(b.title)}</b><br><small>${esc(b.author)} · ${brl(b.price)}</small></div><button class="btn danger sm" data-id="${esc(b.id)}">Remover</button></div>`).join(""):`<p class="empty">Nenhum e-book ainda.</p>`;
  $("#f").onchange=async e=>{const f=e.target.files[0];cover=f?await shrink(f):""};
  $("#add").onclick=()=>{
    const t=$("#t").value.trim(),p=parseFloat($("#p").value.replace(/\./g,"").replace(",","."));
    if(!t||isNaN(p))return toast("Preencha título e preço.");
    const l=$("#l").value.trim();if(l&&!safe(l))return toast("O link deve começar com https://");
    S.books.push({id:Date.now().toString(36),title:t,author:$("#a").value.trim(),cat:$("#k").value.trim(),price:p,desc:$("#d").value.trim(),link:l,cover});
    cover="";save("E-book adicionado!");
  };
  $("#rows").onclick=e=>{const id=e.target.dataset?.id;if(!id)return;
    if(e.target.dataset.sure){S.books=S.books.filter(b=>b.id!==id);save("E-book removido.")}
    else{e.target.dataset.sure=1;e.target.textContent="Confirmar remoção?"}};
  $("#ss").onclick=()=>{S.store={name:$("#sn").value.trim()||"Livraria Digital",contact:$("#sc").value.trim(),tagline:$("#sg").value.trim(),about:$("#sa").value.trim()};save("Dados salvos!")};
}

function shrink(file){return new Promise(res=>{const i=new Image();i.onload=()=>{const W=360,H=540,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d"),s=Math.max(W/i.width,H/i.height),w=i.width*s,h=i.height*s;x.drawImage(i,(W-w)/2,(H-h)/2,w,h);res(c.toDataURL("image/jpeg",.82))};i.onerror=()=>res("");i.src=URL.createObjectURL(file)})}

async function save(msg){
  toast("Publicando…");
  try{
    const art=await claude.use("artifact");
    if(!art)return toast("Publicação indisponível nesta visualização.");
    const c=document.documentElement.cloneNode(true);
    c.querySelector("#app").innerHTML="";c.querySelector("#bar").innerHTML="";c.querySelector("#foot").innerHTML="";c.querySelector("#toast").innerHTML="";
    c.querySelector("#data").textContent=JSON.stringify(S).replace(/</g,"\\u003c");
    await art.publish("<!doctype html>\n"+c.outerHTML);
    toast(msg);
  }catch(e){toast(e&&e.code==="conflict"?"Outra edição foi publicada antes. Recarregando…":"Não foi possível publicar: só o dono da página pode alterar.")}
}

window.addEventListener("hashchange",render);
render();
(async()=>{try{const u=await claude.use("user");if(u&&u.isOwner()){isAdmin=true;render()}}catch(e){}})();
</script>
</body>
</html>
